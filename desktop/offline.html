<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Pharmacy POS — offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, 'Segoe UI', sans-serif; background: #0f7b6c; color: #fff; text-align: center; padding: 24px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { color: #d7f0eb; margin: 6px 0; max-width: 460px; }
      button { margin-top: 18px; padding: 10px 20px; border: 0; border-radius: 8px; background: #fff; color: #0f7b6c; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div>
      <h1>Can't reach the pharmacy server</h1>
      <p>Open the app once while connected; after that the counter keeps selling offline and syncs later.</p>
      <p dir="rtl" lang="ur">سرور سے رابطہ نہیں ہو سکا۔ انٹرنیٹ کنکشن چیک کریں۔</p>
      <button id="retry">Try again / دوبارہ کوشش کریں</button>
    </div>
    <script>
      const url = new URLSearchParams(location.search).get('url')
      document.getElementById('retry').onclick = () => { if (url) location.href = url }
      window.addEventListener('online', () => url && (location.href = url))
    </script>
  </body>
</html>
